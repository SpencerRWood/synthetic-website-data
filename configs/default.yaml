dataset:
  start_date: "2026-01-01"
  end_date: "2026-01-31"
  timezone: "America/New_York"
  random_seed: 42

website:
  entry_page: home
  terminal_pages:
    - order_confirmation
  conversion_pages:
    - order_confirmation
  pages:
    home:
      drop_off_probability: 0.25
    products:
      drop_off_probability: 0.10
      delay:
        shape: 2.5
        scale_seconds: 7.0
    product_detail:
      drop_off_probability: 0.08
      delay:
        shape: 3.0
        scale_seconds: 10.0
    cart:
      drop_off_probability: 0.12
    checkout:
      drop_off_probability: 0.15
    order_confirmation:
      drop_off_probability: 1.0
  graph:
    home:
      products: 0.50
      blog: 0.30
      contact: 0.20
    products:
      product_detail: 0.50
      cart: 0.30
      home: 0.20
    product_detail:
      products: 0.30
      cart: 0.50
      home: 0.20
    blog:
      home: 0.70
      products: 0.30
    contact:
      home: 1.00
    cart:
      checkout: 0.60
      products: 0.40
    checkout:
      order_confirmation: 1.00
    order_confirmation: {}

arrivals:
  maximum_rate_per_hour: 50
  annual_growth_rate: 0.02
  hourly_intensity:
    0: 0.05
    1: 0.03
    2: 0.02
    3: 0.02
    4: 0.03
    5: 0.08
    6: 0.15
    7: 0.30
    8: 0.50
    9: 0.70
    10: 0.85
    11: 0.95
    12: 1.00
    13: 0.95
    14: 0.85
    15: 0.75
    16: 0.65
    17: 0.55
    18: 0.45
    19: 0.35
    20: 0.25
    21: 0.18
    22: 0.12
    23: 0.08
  weekday_intensity:
    monday: 1.00
    tuesday: 1.00
    wednesday: 1.00
    thursday: 1.00
    friday: 0.90
    saturday: 0.45
    sunday: 0.35

sessions:
  default_drop_off_probability: 0.30
  max_page_views: 30

page_views:
  default_delay:
    distribution: gamma
    shape: 2.0
    scale_seconds: 5.0

visitors:
  returning_visitor_rate: 0.25
  max_sessions_per_visitor: 5
