dataset:
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  timezone: "America/New_York"
  random_seed: 42

event_properties_path: event_properties.yaml
campaigns_path: campaigns.yaml

website:
  graph_path: website.yaml
  entry_page: home
  terminal_pages:
    - order_confirmation
  conversion_pages:
    - order_confirmation

arrivals:
  maximum_rate_per_hour: 50
  annual_growth_rate: 0.02
  hourly_intensity:
    0: 0.05
    1: 0.03
    2: 0.02
    3: 0.02
    4: 0.03
    5: 0.08
    6: 0.15
    7: 0.30
    8: 0.50
    9: 0.70
    10: 0.85
    11: 0.95
    12: 1.00
    13: 0.95
    14: 0.85
    15: 0.75
    16: 0.65
    17: 0.55
    18: 0.45
    19: 0.35
    20: 0.25
    21: 0.18
    22: 0.12
    23: 0.08
  weekday_intensity:
    monday: 1.00
    tuesday: 1.00
    wednesday: 1.00
    thursday: 1.00
    friday: 0.90
    saturday: 0.45
    sunday: 0.35

sessions:
  default_drop_off_probability: 0.30
  max_page_views: 30

page_views:
  default_delay:
    distribution: gamma
    shape: 2.0
    scale_seconds: 5.0

visitors:
  returning_visitor_rate: 0.25
  max_sessions_per_visitor: 5
